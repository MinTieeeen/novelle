# Shared settings. Secrets and hosts come from the single settings file novelle/.env (imported below,
# path relative to novelle_backend/, the directory mvnw is run from) or from real environment variables.
spring:
  application:
    name: novelle-backend
  config:
    import: optional:file:../.env[.properties]
  profiles:
    default: local

  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME:NovelleDB};encrypt=true;trustServerCertificate=true;applicationName=novelle-backend
    username: ${DB_APP_USER:novelle_app}
    password: ${APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 15000

  data:
    redis:
      repositories:
        enabled: false               # Redis is used through RedisTemplate, not Spring Data repositories

  session:
    redis:
      repository-type: default       # non-indexed: no keyspace notifications needed
      namespace: spring:session
    timeout: 7d

  task:
    scheduling:                      # used only when app.jobs.enabled (SchedulingConfig)
      pool:
        size: 2
      thread-name-prefix: job-

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.novelle
  type-handlers-package: com.novelle.common.mybatis
  configuration:
    map-underscore-to-camel-case: false   # columns are PascalCase; auto-mapping is case-insensitive
    default-statement-timeout: 30
    jdbc-type-for-null: NULL

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  # Fixed-window limits used by @RateLimited("<name>"); Redis key rl:<name>:<ip|userId>.
  rate-limit:
    enabled: ${RL_ENABLED:true}
    limits:
      login:
        max-requests: ${RL_LOGIN_MAX:10}
        window: ${RL_LOGIN_WINDOW:60s}
      register:
        max-requests: ${RL_REGISTER_MAX:5}
        window: ${RL_REGISTER_WINDOW:1h}
      search:
        max-requests: ${RL_SEARCH_MAX:60}
        window: ${RL_SEARCH_WINDOW:60s}
      progress:
        max-requests: ${RL_PROGRESS_MAX:120}
        window: ${RL_PROGRESS_WINDOW:60s}
  # Cache-aside entries in Redis (CacheService, keys in CacheKeys); SQL Server stays the source of truth.
  cache:
    ttl:
      genre: ${CACHE_GENRE_TTL:1h}
      home: ${CACHE_HOME_TTL:2m}
      story: ${CACHE_STORY_TTL:10m}
      chapter: ${CACHE_CHAPTER_TTL:30m}
  # View counting (G6): Redis counters per Vietnam calendar day, flushed to SQL Server by sp_FlushViews.
  views:
    key-prefix: ${VIEWS_KEY_PREFIX:views:}
    seen-ttl: ${VIEWS_SEEN_TTL:30m}
    zone: ${VIEWS_ZONE:Asia/Ho_Chi_Minh}
    flush-interval: ${VIEWS_FLUSH_INTERVAL:60s}
    flush-batch: ${VIEWS_FLUSH_BATCH:1000}
    flush-max-batches: ${VIEWS_FLUSH_MAX_BATCHES:20}
  # @Scheduled jobs (view flush; scheduled publishing in M6). Off in tests.
  jobs:
    enabled: ${JOBS_ENABLED:true}
  # Public catalog (F1): stories per home block, ratings needed to enter "top rated".
  catalog:
    home-size: ${CATALOG_HOME_SIZE:12}
    top-rated-min-ratings: ${CATALOG_TOP_RATED_MIN_RATINGS:10}
